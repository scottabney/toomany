<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .color-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .color-input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            width: 60px;
            height: 40px;
            border: none;
            cursor: pointer;
        }

        .size-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
        }

        .size-value {
            min-width: 60px;
            text-align: center;
            font-weight: 600;
            color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #qrcode {
            margin: 30px auto;
            text-align: center;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode canvas {
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .download-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: none;
        }

        .download-btn:hover {
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .templates {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .template-btn {
            padding: 10px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .template-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .empty-state {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 QR Code Generator</h1>
        <p class="subtitle">Create customizable QR codes for URLs, text, contacts, and more</p>

        <div class="templates">
            <button class="template-btn" onclick="setTemplate('url')">🌐 URL</button>
            <button class="template-btn" onclick="setTemplate('text')">📝 Text</button>
            <button class="template-btn" onclick="setTemplate('contact')">👤 Contact</button>
            <button class="template-btn" onclick="setTemplate('payment')">💳 Payment</button>
        </div>

        <div class="input-group">
            <label for="inputType">Type:</label>
            <select id="inputType" onchange="updatePlaceholder()">
                <option value="text">Text / URL</option>
                <option value="contact">Contact (vCard)</option>
                <option value="payment">Payment Link</option>
            </select>
        </div>

        <div class="input-group">
            <label for="qrText">Content:</label>
            <textarea id="qrText" placeholder="Enter URL, text, or data"></textarea>
        </div>

        <div class="input-group">
            <label>Customization:</label>
            <div class="color-group">
                <div>
                    <label for="foreground">Foreground Color:</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="foreground" value="#000000">
                        <span id="fgColorText">#000000</span>
                    </div>
                </div>
                <div>
                    <label for="background">Background Color:</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="background" value="#ffffff">
                        <span id="bgColorText">#ffffff</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label for="qrSize">QR Code Size:</label>
            <div class="size-group">
                <input type="range" id="qrSize" min="128" max="512" value="256" step="32">
                <span class="size-value"><span id="sizeValue">256</span>px</span>
            </div>
        </div>

        <button onclick="generateQR()">Generate QR Code</button>

        <div id="qrcode">
            <span class="empty-state">Your QR code will appear here</span>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="downloadQR()">Download PNG</button>
    </div>

    <script src="bundle.js"></script>
    <script>
        // Initialize placeholder on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updatePlaceholder);
        } else {
            updatePlaceholder();
        }
    </script>
</body>
</html>
